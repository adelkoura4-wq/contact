<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saudi Vision | Kitchens & Decor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;font-family:'Cairo',Tahoma,Arial,sans-serif;
background:radial-gradient(circle at 85% 5%,rgba(202,166,91,.20),transparent 28%),
linear-gradient(145deg,#061523,#0d293d 55%,#07131e);
color:#fff;display:flex;align-items:center;justify-content:center;padding:22px
}
.card{
width:100%;max-width:440px;padding:34px 24px 25px;text-align:center;
background:rgba(255,255,255,.075);border:1px solid rgba(213,177,94,.42);
border-radius:30px;box-shadow:0 28px 75px rgba(0,0,0,.42);backdrop-filter:blur(16px)
}
.logo{
width:88px;height:88px;margin:0 auto 17px;border-radius:50%;
display:flex;align-items:center;justify-content:center;
background:linear-gradient(145deg,#e3c477,#9b722c);color:#071725;
font-size:27px;font-weight:800;letter-spacing:1px;
border:3px solid rgba(255,255,255,.8);box-shadow:0 10px 30px rgba(201,161,75,.28)
}
h1{font-size:25px;margin:0;font-weight:800;letter-spacing:.2px}
.company{color:#d9b86d;font-size:15px;font-weight:700;margin-top:5px}
.desc{color:#d5dde4;font-size:14px;line-height:1.8;margin:15px 0 27px}
.label{text-align:right;color:#e2ca91;font-size:12px;font-weight:700;margin:0 4px 9px}
.btn{
display:flex;align-items:center;width:100%;min-height:70px;margin:12px 0;
padding:12px 17px;border-radius:18px;text-decoration:none;color:#fff;
transition:.2s;box-shadow:0 8px 20px rgba(0,0,0,.14)
}
.btn:active{transform:scale(.98)}
.circle{
width:45px;height:45px;border-radius:14px;display:flex;align-items:center;
justify-content:center;font-size:22px;font-weight:800;margin-left:13px;
background:rgba(255,255,255,.16)
}
.text{text-align:right;flex:1}.text strong{display:block;font-size:17px}
.text small{display:block;margin-top:2px;color:rgba(255,255,255,.78);font-size:12px}
.arrow{font-size:24px;opacity:.8}
.tiktok{background:linear-gradient(135deg,#0c0c0e,#27272a);border:1px solid #444}
.whatsapp{background:linear-gradient(135deg,#118b49,#25d366);border:1px solid #48e88a}
.note{
margin-top:23px;padding-top:17px;border-top:1px solid rgba(255,255,255,.12);
color:#aeb9c4;font-size:11px;line-height:1.7
}
.gold{color:#d9b86d}
</style>
</head>
<body>
<main class="card">
  <div class="logo">SV</div>
  <h1>مرحباً بك</h1>
  <div class="company">Saudi Vision Kitchens & Decor</div>
  <div class="desc">للطلب والاستفسار، اختر وسيلة التواصل المناسبة وسنكون سعداء بخدمتك.</div>

  <div class="label">التواصل الاجتماعي</div>
  <a class="btn tiktok" href="https://www.tiktok.com/@visionsa11" target="_blank" rel="noopener">
    <span class="circle">♪</span>
    <span class="text"><strong>TikTok</strong><small>@visionsa11</small></span>
    <span class="arrow">‹</span>
  </a>

  <div class="label" style="margin-top:20px">التواصل المباشر</div>
  <a class="btn whatsapp" href="https://wa.me/966536692991" target="_blank" rel="noopener">
    <span class="circle">◉</span>
    <span class="text"><strong>WhatsApp</strong><small>تواصل معنا مباشرة</small></span>
    <span class="arrow">‹</span>
  </a>

  <div class="note">
    <span class="gold">Saudi Vision</span><br>
    Kitchens • Decor • Cabinets
  </div>
</main>
</body>
</html>
